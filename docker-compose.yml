# Local infrastructure + a production-like run of the API and worker.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: payments_dev }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app"], interval: 5s, retries: 10 }
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "--import", "tsx", "src/server.ts"]
    env_file: [.env]
    environment: { DATABASE_URL: postgres://app:app@postgres:5432/payments_dev, RUN_WORKER: "false" }
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy } }
  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "--import", "tsx", "src/worker.ts"]
    env_file: [.env]
    environment: { DATABASE_URL: postgres://app:app@postgres:5432/payments_dev }
    depends_on: { postgres: { condition: service_healthy } }
volumes:
  pgdata:
